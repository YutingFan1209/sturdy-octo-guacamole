name: Deploy MovieShop API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MovieShopEFCore/MovieShop.Api/**'
      - 'MovieShopEFCore/MovieShop.Api.UnitTests/**'
      - '.github/workflows/deploy-movieshop-api.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_PROJECT: MovieShopEFCore/MovieShop.Api/MovieShop.Api.csproj
      TEST_PROJECT: MovieShopEFCore/MovieShop.Api.UnitTests/MovieShop.Api.UnitTests.csproj
      PUBLISH_DIRECTORY: ${{ github.workspace }}/api-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Test
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "$API_PROJECT" --configuration Release --no-restore --output "$PUBLISH_DIRECTORY"

      - name: Upload immutable API artifact
        uses: actions/upload-artifact@v4
        with:
          name: movieshop-api-${{ github.sha }}
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: movieshop-api-production
      cancel-in-progress: false
    steps:
      - name: Download validated API artifact
        uses: actions/download-artifact@v4
        with:
          name: movieshop-api-${{ github.sha }}
          path: api-publish

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: api-publish

      - name: Smoke test API
        run: curl --fail --retry 5 --retry-delay 10 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/movies"
