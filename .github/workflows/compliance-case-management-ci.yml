name: Compliance Case Management CI
on:
  pull_request: { paths: ['Portfolio/ComplianceCaseManagement/**', '.github/workflows/compliance-case-management-ci.yml'] }
  push: { branches-ignore: [main], paths: ['Portfolio/ComplianceCaseManagement/**', '.github/workflows/compliance-case-management-ci.yml'] }
permissions: { contents: read }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x', cache: true, cache-dependency-path: 'Portfolio/ComplianceCaseManagement/**/*.csproj' }
      - run: dotnet restore Portfolio/ComplianceCaseManagement/ComplianceCaseManagement.slnx
      - run: dotnet build Portfolio/ComplianceCaseManagement/ComplianceCaseManagement.slnx -c Release --no-restore
      - run: dotnet test Portfolio/ComplianceCaseManagement/ComplianceCaseManagement.slnx -c Release --no-build --collect 'XPlat Code Coverage' --results-directory artifacts/tests
      - run: dotnet publish Portfolio/ComplianceCaseManagement/src/ComplianceCaseManagement.Api/ComplianceCaseManagement.Api.csproj -c Release --no-build -o artifacts/api
      - run: dotnet publish Portfolio/ComplianceCaseManagement/src/ComplianceCaseManagement.EscalationWorker/ComplianceCaseManagement.EscalationWorker.csproj -c Release --no-build -o artifacts/worker
      - uses: actions/upload-artifact@v4
        with: { name: 'compliance-case-management-${{ github.sha }}', path: artifacts, retention-days: 14, if-no-files-found: error }
