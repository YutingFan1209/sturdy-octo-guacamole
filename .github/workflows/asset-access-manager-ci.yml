name: Asset Access Manager CI
on:
  pull_request: { paths: ['Portfolio/AssetAccessManager/**', '.github/workflows/asset-access-manager-ci.yml'] }
  push: { branches-ignore: [main], paths: ['Portfolio/AssetAccessManager/**', '.github/workflows/asset-access-manager-ci.yml'] }
permissions: { contents: read }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x', cache: true, cache-dependency-path: 'Portfolio/AssetAccessManager/**/*.csproj' }
      - run: dotnet restore Portfolio/AssetAccessManager/AssetAccessManager.slnx
      - run: dotnet build Portfolio/AssetAccessManager/AssetAccessManager.slnx -c Release --no-restore
      - run: dotnet test Portfolio/AssetAccessManager/AssetAccessManager.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet publish Portfolio/AssetAccessManager/src/AssetAccessManager.Web/AssetAccessManager.Web.csproj -c Release --no-build -o artifacts/web
      - uses: actions/upload-artifact@v4
        with: { name: 'asset-access-manager-${{ github.sha }}', path: artifacts, if-no-files-found: error, retention-days: 14 }
