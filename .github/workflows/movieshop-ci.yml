name: MovieShop CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore API tests
        run: dotnet restore MovieShopEFCore/MovieShop.Api.UnitTests/MovieShop.Api.UnitTests.csproj
      - name: Restore MVC tests
        run: dotnet restore MovieShopMVC.Tests/MovieShopMVC.Tests.csproj
      - name: Build API tests
        run: dotnet build MovieShopEFCore/MovieShop.Api.UnitTests/MovieShop.Api.UnitTests.csproj --configuration Release --no-restore
      - name: Build MVC tests
        run: dotnet build MovieShopMVC.Tests/MovieShopMVC.Tests.csproj --configuration Release --no-restore
      - name: Test API
        run: dotnet test MovieShopEFCore/MovieShop.Api.UnitTests/MovieShop.Api.UnitTests.csproj --configuration Release --no-build
      - name: Test MVC
        run: dotnet test MovieShopMVC.Tests/MovieShopMVC.Tests.csproj --configuration Release --no-build

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MovieShopAngular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: MovieShopAngular/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
