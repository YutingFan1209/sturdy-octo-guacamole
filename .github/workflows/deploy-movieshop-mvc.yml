name: Deploy MovieShop MVC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MovieShopEFCore/MovieShop.Web/**'
      - '.github/workflows/deploy-movieshop-mvc.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MVC_PROJECT: MovieShopEFCore/MovieShop.Web/MovieShopMVC.csproj
      TEST_PROJECT: MovieShopMVC.Tests/MovieShopMVC.Tests.csproj
      PUBLISH_DIRECTORY: ${{ github.workspace }}/mvc-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Test
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-restore

      - name: Publish
        run: >-
          dotnet publish "$MVC_PROJECT"
          --configuration Release
          --no-restore
          --output "$PUBLISH_DIRECTORY"

      - name: Upload immutable MVC artifact
        uses: actions/upload-artifact@v4
        with:
          name: movieshop-mvc-${{ github.sha }}
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: movieshop-mvc-production
      cancel-in-progress: false
    steps:
      - name: Download validated MVC artifact
        uses: actions/download-artifact@v4
        with:
          name: movieshop-mvc-${{ github.sha }}
          path: mvc-publish

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy MVC to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_MVC_WEBAPP_NAME }}
          package: mvc-publish

      - name: Smoke test MVC
        run: curl --fail --retry 5 --retry-delay 10 "https://${{ vars.AZURE_MVC_WEBAPP_NAME }}.azurewebsites.net/"
