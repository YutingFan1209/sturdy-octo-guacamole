name: Reconciliation Platform CI
on:
  pull_request: { paths: ['Portfolio/ReconciliationPlatform/**', '.github/workflows/reconciliation-platform-ci.yml'] }
  push: { branches-ignore: [main], paths: ['Portfolio/ReconciliationPlatform/**', '.github/workflows/reconciliation-platform-ci.yml'] }
permissions: { contents: read }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x', cache: true, cache-dependency-path: 'Portfolio/ReconciliationPlatform/**/*.csproj' }
      - run: dotnet restore Portfolio/ReconciliationPlatform/ReconciliationPlatform.slnx
      - run: dotnet build Portfolio/ReconciliationPlatform/ReconciliationPlatform.slnx -c Release --no-restore
      - run: dotnet test Portfolio/ReconciliationPlatform/ReconciliationPlatform.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet publish Portfolio/ReconciliationPlatform/src/ReconciliationPlatform.IngestionApi/ReconciliationPlatform.IngestionApi.csproj -c Release --no-build -o artifacts/ingestion
      - run: dotnet publish Portfolio/ReconciliationPlatform/src/ReconciliationPlatform.Reconciler/ReconciliationPlatform.Reconciler.csproj -c Release --no-build -o artifacts/reconciler
      - run: dotnet publish Portfolio/ReconciliationPlatform/src/ReconciliationPlatform.Notifications/ReconciliationPlatform.Notifications.csproj -c Release --no-build -o artifacts/notifications
      - uses: actions/upload-artifact@v4
        with: { name: 'reconciliation-platform-${{ github.sha }}', path: artifacts, retention-days: 14, if-no-files-found: error }
