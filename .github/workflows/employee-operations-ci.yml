name: Employee Operations CI
on:
  pull_request:
    paths: ['Portfolio/EmployeeOperations/**', '.github/workflows/employee-operations-ci.yml']
  push:
    branches-ignore: [main]
    paths: ['Portfolio/EmployeeOperations/**', '.github/workflows/employee-operations-ci.yml']
permissions: { contents: read }
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x', cache: true, cache-dependency-path: 'Portfolio/EmployeeOperations/**/*.csproj' }
      - run: dotnet restore Portfolio/EmployeeOperations/EmployeeOperations.slnx
      - run: dotnet build Portfolio/EmployeeOperations/EmployeeOperations.slnx -c Release --no-restore
      - run: dotnet test Portfolio/EmployeeOperations/EmployeeOperations.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet publish Portfolio/EmployeeOperations/src/EmployeeOperations.Api/EmployeeOperations.Api.csproj -c Release --no-build -o artifacts/api
      - uses: actions/upload-artifact@v4
        with: { name: 'employee-operations-api-${{ github.sha }}', path: artifacts, if-no-files-found: error, retention-days: 14 }
  angular:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Portfolio/EmployeeOperations/client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '26', cache: npm, cache-dependency-path: Portfolio/EmployeeOperations/client/package-lock.json }
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: 'employee-operations-angular-${{ github.sha }}', path: Portfolio/EmployeeOperations/client/dist, if-no-files-found: error, retention-days: 14 }
