services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "${COMPLIANCE_SQL_PASSWORD:?Set COMPLIANCE_SQL_PASSWORD}" }
    ports: ["1435:1433"]
  api:
    build: { context: ., dockerfile: src/ComplianceCaseManagement.Api/Dockerfile }
    environment: { ConnectionStrings__ComplianceCases: "Server=sqlserver;Database=ComplianceCases;User Id=sa;Password=${COMPLIANCE_SQL_PASSWORD};TrustServerCertificate=True", Jwt__SigningKey: "${COMPLIANCE_JWT_KEY:?Set COMPLIANCE_JWT_KEY}" }
    ports: ["5083:8080"]
  worker:
    build: { context: ., dockerfile: src/ComplianceCaseManagement.EscalationWorker/Dockerfile }
    environment: { ConnectionStrings__ComplianceCases: "Server=sqlserver;Database=ComplianceCases;User Id=sa;Password=${COMPLIANCE_SQL_PASSWORD};TrustServerCertificate=True" }
