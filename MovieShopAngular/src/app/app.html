<header class="site-header">
  <a class="brand" routerLink="/">MovieShop</a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Movies</a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/purchases" routerLinkActive="active">Purchases</a>
      <span>Hi, {{ auth.currentUser()?.firstName }}</span>
      <button type="button" (click)="auth.logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a class="register-link" routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
