<section class="auth-card">
  <p class="eyebrow">Welcome back</p><h1>Log in</h1>
  <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
    <label>Email<input type="email" formControlName="email" autocomplete="email">@if (form.controls.email.touched && form.controls.email.invalid) { <span class="field-error">Enter a valid email.</span> }</label>
    <label>Password<input type="password" formControlName="password" autocomplete="current-password">@if (form.controls.password.touched && form.controls.password.invalid) { <span class="field-error">Password is required.</span> }</label>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    <button class="primary-button" type="submit" [disabled]="submitting()">{{ submitting() ? 'Logging in…' : 'Log in' }}</button>
  </form>
  <p class="auth-footnote">New here? <a routerLink="/register">Create an account</a>.</p>
</section>
