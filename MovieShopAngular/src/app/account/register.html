<section class="auth-card">
  <p class="eyebrow">Join MovieShop</p><h1>Create account</h1>
  <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid two">
      <label>First name<input formControlName="firstName" autocomplete="given-name"></label>
      <label>Last name<input formControlName="lastName" autocomplete="family-name"></label>
    </div>
    <label>Email<input type="email" formControlName="email" autocomplete="email">@if (form.controls.email.touched && form.controls.email.invalid) { <span class="field-error">Enter a valid email.</span> }</label>
    <label>Date of birth<input type="date" formControlName="dateOfBirth" autocomplete="bday"></label>
    <label>Password<input type="password" formControlName="password" autocomplete="new-password">@if (form.controls.password.touched && form.controls.password.invalid) { <span class="field-error">Use at least 6 characters.</span> }</label>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    <button class="primary-button" type="submit" [disabled]="submitting()">{{ submitting() ? 'Creating…' : 'Create account' }}</button>
  </form>
  <p class="auth-footnote">Already registered? <a routerLink="/login">Log in</a>.</p>
</section>
